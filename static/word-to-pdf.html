<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word to PDF - SnapTool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet">
  <style>
    :root {
      --bg: #FBFBFA;
      --surface: #FFFFFF;
      --border: #EAEAEA;
      --text: #2F3437;
      --text-muted: #787774;
      --heading: #111111;
      --accent: #111111;
      --accent-text: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-left { font-weight: 600; font-size: 1rem; color: var(--heading); text-decoration: none; }
    .nav-center { display: flex; gap: 24px; }
    .nav-link { 
      font-size: 0.875rem; 
      color: var(--text-muted); 
      text-decoration: none; 
      transition: color 0.2s; 
    }
    .nav-link:hover { color: var(--heading); }
    .nav-link.active { color: var(--heading); font-weight: 500; }
    .nav-right {
      font-size: 0.875rem; color: var(--text-muted); text-decoration: none;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 100px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 60px;
    }
    
    .header { text-align: left; }
    .header h1 {
      font-family: 'Newsreader', serif;
      font-weight: 500;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: -0.02em;
      color: var(--heading);
      margin-bottom: 16px;
    }
    .header p { color: var(--text-muted); font-size: 1.125rem; max-width: 600px; line-height: 1.6; }

    .upload-zone {
      background: var(--surface);
      padding: 80px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .upload-zone.drag-active { border-color: var(--heading); background: #fafafa; }
    
    .upload-icon { font-size: 32px; color: var(--text-muted); margin-bottom: 24px; }
    .upload-title { font-size: 1.125rem; font-weight: 500; color: var(--heading); margin-bottom: 8px; }
    .upload-desc { color: var(--text-muted); margin-bottom: 32px; font-size: 0.95rem; }
    
    .btn {
      font-family: 'Geist Mono', monospace;
      font-size: 0.8rem;
      padding: 10px 24px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-accent { background: var(--accent); color: var(--accent-text); }
    .btn-accent:hover { background: #333333; }
    .btn-ghost { background: transparent; color: var(--heading); border: 1px solid var(--border); }
    .btn-ghost:hover { background: #f9f9f9; }
    
    .queue-zone { display: none; margin-top: 20px; }
    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .queue-header-left { display: flex; align-items: center; gap: 16px; }
    .queue-header-right { display: flex; align-items: center; gap: 12px; }
    #queue-title { font-size: 1.125rem; font-weight: 500; color: var(--heading); }
    #queue-counter { 
      background: #f0f0f0; 
      color: var(--text-muted); 
      padding: 4px 8px; 
      font-family: 'Geist Mono', monospace; 
      font-size: 0.75rem; 
    }
    
    .file-list { list-style: none; display: flex; flex-direction: column; }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .file-info { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
    .file-icon { color: var(--text-muted); font-size: 24px; }
    .file-details { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .file-name { font-weight: 500; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px; color: var(--heading); }
    .file-status-text { font-family: 'Geist Mono', monospace; font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .file-actions { display: flex; align-items: center; gap: 12px; }
    
    .status-icon { font-size: 16px; }
    .status-pending { color: var(--text-muted); }
    .status-processing { color: #555; animation: spin 1s linear infinite; }
    .status-done { color: #111; }
    .status-error { color: #e00; }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }

    footer {
      border-top: 1px solid var(--border);
      padding: 32px 40px;
      margin-top: auto;
      background: var(--surface);
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-logo { font-weight: 500; font-size: 0.9rem; color: var(--heading); }
    .footer-text { font-family: 'Geist Mono', monospace; font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-left">SnapTool</a>
    <div class="nav-center">
      <a href="/bg-remover" class="nav-link">BG Remover</a>
      <a href="/word-to-pdf" class="nav-link active">Word → PDF</a>
      <a href="/pdf-to-word" class="nav-link">PDF → Word</a>
      <a href="/doc-tools" class="nav-link">Doc Toolkit</a>
      <a href="/img-to-pdf" class="nav-link">Img → PDF</a>
    </div>
    <a href="/" class="nav-right">← Home</a>
  </nav>

  <div class="container">
    <div class="header">
      <h1>Word to PDF</h1>
      <p>Convert your Word documents to PDF securely in your browser.</p>
    </div>

    <div class="upload-zone" id="upload-zone">
      <span class="material-symbols-outlined upload-icon">description</span>
      <div class="upload-title">Drag & drop files here</div>
      <div class="upload-desc">or click to browse from your computer</div>
      <button class="btn btn-accent" id="browse-btn">
        Browse Files
      </button>
      <input type="file" id="file-input" multiple accept=".doc,.docx" style="display:none;">
    </div>

    <div class="queue-zone" id="queue-zone">
      <div class="queue-header">
        <div class="queue-header-left">
          <div id="queue-title">Conversion Queue</div>
          <div id="queue-counter">0/0</div>
        </div>
        <div class="queue-header-right">
          <button class="btn btn-ghost" id="clear-btn">Clear All</button>
          <button class="btn btn-accent" id="download-all-btn" style="display:none;">
            Download All
          </button>
        </div>
      </div>
      <ul class="file-list" id="file-list"></ul>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <span class="footer-logo">SnapTool</span>
      <span class="footer-text">© 2024 SnapTool · All processing is local.</span>
    </div>
  </footer>

  <script>
    let queue = [];
    let isProcessing = false;

    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-input');
    const browseBtn = document.getElementById('browse-btn');
    const queueZone = document.getElementById('queue-zone');
    const fileList = document.getElementById('file-list');
    const queueCounter = document.getElementById('queue-counter');
    const downloadAllBtn = document.getElementById('download-all-btn');
    const clearBtn = document.getElementById('clear-btn');

    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('drag-active');
    });
    uploadZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('drag-active');
    });
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('drag-active');
      if (e.dataTransfer.files.length) {
        addFiles(Array.from(e.dataTransfer.files));
      }
    });

    browseBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        addFiles(Array.from(fileInput.files));
        fileInput.value = '';
      }
    });

    function addFiles(files) {
      files.forEach(file => {
        queue.push({
          file: file,
          status: 'pending',
          blob: null,
          outName: null,
          errorMsg: null
        });
      });
      renderQueue();
      if (!isProcessing) processNext();
    }

    async function processNext() {
      const nextItem = queue.find(item => item.status === 'pending');
      if (!nextItem) {
        isProcessing = false;
        renderQueue();
        return;
      }

      isProcessing = true;
      nextItem.status = 'processing';
      renderQueue();

      try {
        const formData = new FormData();
        formData.append('file', nextItem.file);

        const response = await fetch('/api/word-to-pdf', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('Conversion failed');
        }

        const blob = await response.blob();
        nextItem.blob = blob;
        nextItem.outName = nextItem.file.name.replace(/\.[^/.]+$/, '') + '.pdf';
        nextItem.status = 'done';
      } catch (err) {
        nextItem.status = 'error';
        nextItem.errorMsg = err.message || 'Error occurred';
      }

      processNext();
    }

    function renderQueue() {
      if (queue.length === 0) {
        queueZone.style.display = 'none';
        return;
      }
      queueZone.style.display = 'block';
      fileList.innerHTML = '';

      let doneCount = 0;
      queue.forEach((item, index) => {
        if (item.status === 'done') doneCount++;

        const li = document.createElement('li');
        li.className = 'file-item';

        let statusIcon, statusText;
        if (item.status === 'pending') {
          statusIcon = '<span class="material-symbols-outlined status-icon status-pending">schedule</span>';
          statusText = '<span class="status-pending">WAITING</span>';
        } else if (item.status === 'processing') {
          statusIcon = '<span class="material-symbols-outlined status-icon status-processing">progress_activity</span>';
          statusText = '<span class="status-processing">PROCESSING</span>';
        } else if (item.status === 'done') {
          statusIcon = '<span class="material-symbols-outlined status-icon status-done">check_circle</span>';
          statusText = '<span class="status-done">COMPLETED</span>';
        } else {
          statusIcon = '<span class="material-symbols-outlined status-icon status-error">error</span>';
          statusText = `<span class="status-error">${item.errorMsg}</span>`;
        }

        let actionBtn = '';
        if (item.status === 'done') {
          actionBtn = `<button class="btn btn-ghost" onclick="downloadItem(${index})">Download</button>`;
        }

        li.innerHTML = `
          <div class="file-info">
            <span class="material-symbols-outlined file-icon">description</span>
            <div class="file-details">
              <div class="file-name" title="${item.file.name}">${item.file.name}</div>
              <div class="file-status-text">${statusIcon} ${statusText}</div>
            </div>
          </div>
          <div class="file-actions">
            ${actionBtn}
          </div>
        `;
        fileList.appendChild(li);
      });

      queueCounter.textContent = `${doneCount}/${queue.length}`;
      downloadAllBtn.style.display = doneCount > 0 ? 'inline-flex' : 'none';
    }

    window.downloadItem = function(index) {
      const item = queue[index];
      if (item.status !== 'done' || !item.blob) return;
      const url = window.URL.createObjectURL(item.blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = item.outName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    };

    downloadAllBtn.addEventListener('click', () => {
      queue.forEach((item, index) => {
        if (item.status === 'done') {
          downloadItem(index);
        }
      });
    });

    clearBtn.addEventListener('click', () => {
      queue = queue.filter(item => item.status === 'processing');
      renderQueue();
    });
  </script>
</body>
</html>
