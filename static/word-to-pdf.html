<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word to PDF - SnapTool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Geist:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --surface: #0e0e12;
      --surface2: #16161c;
      --surface3: #1c1c24;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --text: #f0f0f4;
      --text2: #9090a0;
      --text3: #50505e;
      --accent: #3b82f6;
      --accent2: #60a5fa;
      --accent-glow: rgba(59,130,246,0.15);
      --green: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); font-family: 'Geist', sans-serif; min-height: 100dvh; display: flex; flex-direction: column; padding-top: 90px;
      overflow-x: hidden; position: relative;
    }
    .bg-orbs {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1;
    }
    .orb1 { position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%); filter: blur(60px); }
    .orb2 { position: absolute; bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(96,165,250,0.05) 0%, transparent 70%); filter: blur(60px); }

    .nav-pill { color: #9090a0; font-family: 'Geist Mono',monospace; font-size: 0.72rem; letter-spacing: 0.04em; padding: 6px 12px; border-radius: 9999px; text-decoration: none; transition: color 0.15s, background 0.15s; white-space: nowrap; }
    .nav-pill:hover { color: #f0f0f4; background: rgba(255,255,255,0.06); }
    .nav-pill.active { color: #60a5fa; background: rgba(59,130,246,0.12); }

    .container { max-width: 900px; margin: 0 auto; width: 100%; padding: 40px 20px; flex: 1; display: flex; flex-direction: column; gap: 40px; }
    
    .header { text-align: center; }
    .header h1 { font-weight: 800; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.04em; margin-bottom: 12px; }
    .header p { color: var(--text2); font-size: 1.1rem; }

    .upload-wrapper { position: relative; padding: 1px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); transition: all 0.3s ease; }
    .upload-wrapper:hover { background: linear-gradient(180deg, rgba(96,165,250,0.3), rgba(255,255,255,0.05)); box-shadow: 0 0 40px var(--accent-glow); }
    .upload-zone {
      background: var(--surface); border-radius: 23px; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 1px dashed var(--border-hover); cursor: pointer; transition: all 0.3s ease;
    }
    .upload-wrapper:hover .upload-zone { border-color: rgba(96,165,250,0.4); background: var(--surface2); }
    .upload-zone.drag-active { border-color: var(--accent); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--accent); }
    
    .upload-icon { font-size: 48px; color: var(--text3); margin-bottom: 20px; transition: color 0.3s ease; }
    .upload-wrapper:hover .upload-icon { color: var(--accent2); }
    
    .upload-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
    .upload-desc { color: var(--text2); margin-bottom: 24px; text-align: center; font-size: 0.95rem; }
    
    .btn {
      font-family: 'Geist Mono', monospace; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 10px 20px; border-radius: 9999px; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
    .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    
    .queue-zone { display: none; margin-top: 20px; }
    .queue-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 16px; }
    .queue-header-left { display: flex; align-items: center; gap: 12px; }
    .queue-header-right { display: flex; align-items: center; gap: 12px; }
    #queue-title { font-size: 1.25rem; font-weight: 600; }
    #queue-counter { background: var(--surface3); color: var(--text2); padding: 4px 10px; border-radius: 9999px; font-family: 'Geist Mono', monospace; font-size: 0.75rem; }
    
    .file-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .file-item {
      display: flex; align-items: center; justify-content: space-between; padding: 16px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .file-item:hover { border-color: var(--border-hover); background: var(--surface2); }
    .file-info { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
    .file-icon { color: var(--text2); font-size: 24px; }
    .file-details { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .file-name { font-weight: 500; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
    .file-status-text { font-size: 0.8rem; color: var(--text2); display: flex; align-items: center; gap: 6px; }
    .file-actions { display: flex; align-items: center; gap: 12px; }
    
    .status-icon { font-size: 18px; }
    .status-pending { color: var(--text3); }
    .status-processing { color: var(--accent); animation: spin 1s linear infinite; }
    .status-done { color: var(--green); }
    .status-error { color: var(--red); }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    /* ANIMATIONS */
    @keyframes fadeUp { from { opacity:0; transform:translateY(18px); filter:blur(4px); } to { opacity:1; transform:translateY(0); filter:blur(0); } }
    .anim { opacity:0; } 
    .anim.visible { animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }

    @media (max-width: 600px) {
      .header h1 { font-size: 2rem; }
      .upload-zone { padding: 40px 20px; }
      .file-item { flex-direction: column; align-items: flex-start; gap: 16px; }
      .file-actions { align-self: flex-end; }
      .file-name { max-width: 200px; }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb1"></div>
    <div class="orb2"></div>
  </div>

  <nav id="navbar" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);">
    <div style="display:flex;align-items:center;gap:6px;background:rgba(14,14,18,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08);border-radius:9999px;padding:6px 6px 6px 20px;box-shadow:0 0 0 1px rgba(0,0,0,0.5),0 20px 40px rgba(0,0,0,0.4);">
      <a href="/" style="font-weight:800;font-size:0.9rem;color:#f0f0f4;text-decoration:none;letter-spacing:-0.03em;margin-right:8px;">SnapTool</a>
      <div style="width:1px;height:16px;background:rgba(255,255,255,0.08);margin:0 8px;"></div>
      <a href="/bg-remover" class="nav-pill">BG Remover</a>
      <a href="/word-to-pdf" class="nav-pill active">Word → PDF</a>
      <a href="/pdf-to-word" class="nav-pill">PDF → Word</a>
      <a href="/doc-tools" class="nav-pill">Doc Toolkit</a>
      <a href="/img-to-pdf" class="nav-pill">Img → PDF</a>
      <div style="width:1px;height:16px;background:rgba(255,255,255,0.08);margin:0 6px;"></div>
      <a href="/" style="background:#f0f0f4;color:#050508;font-family:'Geist Mono',monospace;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase;padding:7px 14px;border-radius:9999px;text-decoration:none;font-weight:600;white-space:nowrap;">← Home</a>
    </div>
  </nav>

  <div class="container">
    <div class="header anim">
      <h1>Word → PDF</h1>
      <p>Convert your Word documents to PDF securely in your browser.</p>
    </div>

    <div class="upload-wrapper anim" style="animation-delay: 0.1s;">
      <div class="upload-zone" id="upload-zone">
        <span class="material-symbols-outlined upload-icon">description</span>
        <div class="upload-title">Drag & drop files here</div>
        <div class="upload-desc">or click to browse from your computer</div>
        <button class="btn btn-accent" id="browse-btn">
          <span class="material-symbols-outlined" style="font-size:18px;">folder_open</span> Browse Files
        </button>
        <input type="file" id="file-input" multiple accept=".doc,.docx" style="display:none;">
      </div>
    </div>

    <div class="queue-zone anim" id="queue-zone" style="animation-delay: 0.2s;">
      <div class="queue-header">
        <div class="queue-header-left">
          <div id="queue-title">Conversion Queue</div>
          <div id="queue-counter">0/0</div>
        </div>
        <div class="queue-header-right">
          <button class="btn btn-ghost" id="clear-btn">Clear All</button>
          <button class="btn btn-accent" id="download-all-btn" style="display:none;">
            <span class="material-symbols-outlined" style="font-size:18px;">download</span> Download All
          </button>
        </div>
      </div>
      <ul class="file-list" id="file-list"></ul>
    </div>
  </div>

  <footer style="border-top:1px solid rgba(255,255,255,0.04);padding:32px clamp(1.25rem,5vw,4rem);margin-top:auto;">
    <div style="max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
      <span style="font-weight:800;font-size:0.9rem;letter-spacing:-0.02em;color:#3f3f50;">SnapTool</span>
      <span style="font-family:'Geist Mono',monospace;font-size:0.7rem;color:#3f3f50;">© 2024 SnapTool · All processing is local.</span>
    </div>
  </footer>

  <script>
    const obs = new IntersectionObserver(entries => entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } }), { threshold: 0.1 });
    document.querySelectorAll('.anim').forEach(el => obs.observe(el));

    let queue = [];
    let isProcessing = false;

    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-input');
    const browseBtn = document.getElementById('browse-btn');
    const queueZone = document.getElementById('queue-zone');
    const fileList = document.getElementById('file-list');
    const queueCounter = document.getElementById('queue-counter');
    const downloadAllBtn = document.getElementById('download-all-btn');
    const clearBtn = document.getElementById('clear-btn');

    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('drag-active');
    });
    uploadZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('drag-active');
    });
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('drag-active');
      if (e.dataTransfer.files.length) {
        addFiles(Array.from(e.dataTransfer.files));
      }
    });

    browseBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        addFiles(Array.from(fileInput.files));
        fileInput.value = '';
      }
    });

    function addFiles(files) {
      files.forEach(file => {
        queue.push({
          file: file,
          status: 'pending',
          blob: null,
          outName: null,
          errorMsg: null
        });
      });
      renderQueue();
      if (!isProcessing) processNext();
    }

    async function processNext() {
      const nextItem = queue.find(item => item.status === 'pending');
      if (!nextItem) {
        isProcessing = false;
        renderQueue();
        return;
      }

      isProcessing = true;
      nextItem.status = 'processing';
      renderQueue();

      try {
        const formData = new FormData();
        formData.append('file', nextItem.file);

        const response = await fetch('/api/word-to-pdf', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('Conversion failed');
        }

        const blob = await response.blob();
        nextItem.blob = blob;
        nextItem.outName = nextItem.file.name.replace(/\\.[^/.]+$/, '') + '.pdf';
        nextItem.status = 'done';
      } catch (err) {
        nextItem.status = 'error';
        nextItem.errorMsg = err.message || 'Error occurred';
      }

      processNext();
    }

    function renderQueue() {
      if (queue.length === 0) {
        queueZone.style.display = 'none';
        return;
      }
      queueZone.style.display = 'block';
      fileList.innerHTML = '';

      let doneCount = 0;
      queue.forEach((item, index) => {
        if (item.status === 'done') doneCount++;

        const li = document.createElement('li');
        li.className = 'file-item';

        let statusIcon, statusText;
        if (item.status === 'pending') {
          statusIcon = '<span class="material-symbols-outlined status-icon status-pending">schedule</span>';
          statusText = '<span class="status-pending">Waiting...</span>';
        } else if (item.status === 'processing') {
          statusIcon = '<span class="material-symbols-outlined status-icon status-processing">progress_activity</span>';
          statusText = '<span class="status-processing">Processing...</span>';
        } else if (item.status === 'done') {
          statusIcon = '<span class="material-symbols-outlined status-icon status-done">check_circle</span>';
          statusText = '<span class="status-done">Completed</span>';
        } else {
          statusIcon = '<span class="material-symbols-outlined status-icon status-error">error</span>';
          statusText = `<span class="status-error">${item.errorMsg}</span>`;
        }

        let actionBtn = '';
        if (item.status === 'done') {
          actionBtn = `<button class="btn btn-accent" onclick="downloadItem(${index})">Download</button>`;
        }

        li.innerHTML = `
          <div class="file-info">
            <span class="material-symbols-outlined file-icon">description</span>
            <div class="file-details">
              <div class="file-name" title="${item.file.name}">${item.file.name}</div>
              <div class="file-status-text">${statusIcon} ${statusText}</div>
            </div>
          </div>
          <div class="file-actions">
            ${actionBtn}
          </div>
        `;
        fileList.appendChild(li);
      });

      queueCounter.textContent = `${doneCount}/${queue.length}`;
      downloadAllBtn.style.display = doneCount > 0 ? 'inline-flex' : 'none';
    }

    window.downloadItem = function(index) {
      const item = queue[index];
      if (item.status !== 'done' || !item.blob) return;
      const url = window.URL.createObjectURL(item.blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = item.outName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    };

    downloadAllBtn.addEventListener('click', () => {
      queue.forEach((item, index) => {
        if (item.status === 'done') {
          downloadItem(index);
        }
      });
    });

    clearBtn.addEventListener('click', () => {
      queue = queue.filter(item => item.status === 'processing');
      renderQueue();
    });
  </script>
</body>
</html>
